# HCF Core - 1.7/1.8 configuration

server:
  id: "hcf-01"
  network-name: "HCF"
  # When true, the core refuses to boot without durable MongoDB persistence enabled.
  # Keep false for local test servers.
  production-mode: false

spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

warzone-radius: 1000

mongo:
  enabled: false
  uri: "mongodb://127.0.0.1:27017"
  database: "hcf"

redis:
  enabled: false
  uri: "redis://127.0.0.1:6379"

database:
  enabled: false
  host: localhost
  port: 3306
  name: hcf
  username: root
  password: password
  pool-size: 10

faction:
  max-members: 25
  max-claims: 6
  dtr-per-member: 1.01
  max-dtr: 6.01
  regen-per-minute: 0.1
  freeze-duration-seconds: 30
  invite-expire-seconds: 60

deathban:
  enabled: true
  default-duration-minutes: 30
  lives: 3

deathban-arena:
  # Arena revive flow is intentionally disabled until a real arena region/reward flow is configured.
  enabled: false
  world: world
  x: 0.5
  y: 80.0
  z: 0.5
  wins-to-revive: 3

combat:
  tag-seconds: 30
  archer-tag-seconds: 10
  enderpearl-seconds: 16
  golden-apple-seconds: 300

timers:
  ender-pearl: 16
  gapple: 300
  combat: 30
  logout: 30
  home: 10
  rod: 3

custom-timers: {}

anticlean:
  hits-to-activate: 3
  duration-seconds: 45
  team-limit: 8
  koth-disable-radius: 35

claims:
  movement-check-block-shift: 4
  price-per-block: 2.0
  minimum-price: 250
  minimum-size: 5
  maximum-size: 150

koth:
  cap-time-seconds: 900

conquest:
  points-to-win: 300
  cap-time-seconds: 30

kill-the-king:
  enabled: false
  reward-commands:
    - "give %player% diamond 16"

purge:
  enabled: false
  duration-minutes: 60
  deathban-disabled: true

citadel:
  cap-time-seconds: 1800

eotw:
  deathban-multiplier: 2.0

sotw:
  default-minutes: 60
  allow-pvp-enable: true

event-scheduler:
  enabled: true
  events:
    koth_example:
      type: KOTH
      target: Example
      cron: "0 18 * * *"

scoreboard:
  enabled: true
  title: "&6&lHCF"
  update-ticks: 20
  title-frames:
    - "&f&lHCF"
    - "&c&lH&f&lCF"
    - "&c&lHC&f&lF"
    - "&c&lHCF"

tablist:
  enabled: true
  header: "&c&lHCF &7| &f%online%/%max%"
  footer: "&7play.yourserver.net"
  update-ticks: 40

nametags:
  enabled: true
  ally-color: "&a"
  enemy-color: "&c"
  faction-format: "&7[%faction%] &f"
  ftop:
    1: "&6➊"
    2: "&f➋"
    3: "&9➌"

waypoints:
  enabled: true

enchant-limiter:
  enabled: true
  limits:
    PROTECTION_ENVIRONMENTAL: 2
    DAMAGE_ALL: 2
    DURABILITY: 3

potion-limiter:
  enabled: true
  allowed:
    - SPEED
    - FIRE_RESISTANCE
    - INSTANT_HEAL
    - STRENGTH

strength-nerf:
  enabled: true
  multiplier: 0.65

rod-cooldown:
  enabled: true
  seconds: 3

pvp-classes:
  enabled: true
  warmup-seconds: 3

classes:
  archer: true
  bard: true
  rogue: true
  ghost: true

abilities:
  enabled: true

kits: {}

refill-signs:
  enabled: true
  lines:
    - "[Refill]"
    - "Potions"

staff-mode:
  enabled: true

team-manage:
  missions-enabled: false
  contracts-enabled: false
  gem-shop-enabled: false

key-all:
  interval-minutes: 60
  commands:
    - "crate give %player% Koth 1"

discord:
  enabled: false
  webhooks:
    kills: ""
    koth: ""
    reports: ""

holograms:
  enabled: true
  location:
    world: world
    x: 0.5
    y: 105.0
    z: 0.5
  lines:
    - "&6&lTop Kills"
    - "&7%top_kills%"

teamfight:
  enabled: true
  world: world
  min-x: -200
  max-x: 200
  min-z: -200
  max-z: 200

base-maker:
  max-size: 32

fall-trap:
  depth: 20

glowstone:
  reset-minutes: 20
  announce-interval-percent: 15
