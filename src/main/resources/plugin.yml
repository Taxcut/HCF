  eotw:
    description: EOTW administration.
  conquest:
    description: Start conquest.
  koth:
    description: KOTH administration.
  ktk:
    description: Start Kill The King.
  purge:
    description: Start purge event.
  citadel:
    description: Start citadel event.
  mountain:
    description: Start mountain event.
  systemteam:
    description: Show system teams.
